# Development environment. Tool versions mirror the authoritative pins:
# go == go.mod directive, golangci-lint == CI job, gitleaks == pre-commit hook.

[tools]
go = "1.25.0"
golangci-lint = "2.13.2"
gitleaks = "8.30.1"

[tasks.build]
description = "Build llmp2p and llmp2pd into bin/"
run = "make build"

[tasks.test]
description = "Run the test suite"
run = "make test"

[tasks.lint]
description = "Run golangci-lint"
run = "make lint"

[tasks.fmt]
description = "Format Go code"
run = "make fmt"

[tasks.clean]
description = "Remove build artifacts"
run = "make clean"
